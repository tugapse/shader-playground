<div class="top-bar">
  <app-icon class="play-icon" iconName="fa-play" [ngClass]="{playing:scene && scene.isEditorMode}" (click)="scene && scene.isEditorMode = !scene.isEditorMode"></app-icon>
</div>

<div class="container">

  <app-sidebar [scene]="scene"></app-sidebar>
  <editor-inpector [targetEntity]="selectedEntity" *ngIf="selectedEntity"></editor-inpector>
  <app-canvas tabindex="0" class="canvas" [scene]="scene"
    (onGlContextCreated)="onGlContextCreated($event)"></app-canvas>

  </div>
