<div class="modal-backdrop" *ngIf="request">
  <div class="modal-container">
    <div class="modal-header">
      <h3 class="modal-title">{{ request.title }}</h3>
    </div>
    <div class="modal-body">
      <p>{{ request.message }}</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" (click)="cancel()">{{ request.cancelText }}</button>
      <button class="btn btn-confirm" (click)="confirm()">{{ request.confirmText }}</button>
    </div>
  </div>
</div>
