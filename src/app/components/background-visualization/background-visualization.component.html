<div class="visualization-container">
  <div class="svg-fade-overlay"></div>

  <svg class="engine-matrix-svg" viewBox="0 0 1200 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#2c70cf" stop-opacity="0.12" />
        <stop offset="100%" stop-color="#141920" stop-opacity="0" />
      </linearGradient>
    </defs>
    @if(showStars){
    <g class="star-field">
      <circle cx="150" cy="80" r="1" class="star star-dim" />
      <circle cx="320" cy="180" r="1" class="star star-dim" />
      <circle cx="450" cy="40" r="1.5" class="star star-dim" />
      <circle cx="750" cy="120" r="1" class="star star-dim" />
      <circle cx="980" cy="60" r="1" class="star star-dim" />
      <circle cx="1110" cy="220" r="1.5" class="star star-dim" />

      <circle cx="80" cy="200" r="1.5" class="star star-twinkle-fast" />
      <circle cx="230" cy="110" r="2" class="star star-twinkle-slow" />
      <circle cx="550" cy="90" r="1.5" class="star star-twinkle-fast" />
      <circle cx="680" cy="230" r="2" class="star star-twinkle-slow" />
      <circle cx="890" cy="140" r="1.5" class="star star-twinkle-fast" />
      <circle cx="1050" cy="100" r="2" class="star star-twinkle-slow" />
    </g>
    }

    <g class="grid-perspective">
      <rect width="100%" height="100%" fill="url(#grid-fade)" />
      <path class="grid-lines"
        d="M 0,50 L 1200,50 M 0,110 L 1200,110 M 0,180 L 1200,180 M 0,260 L 1200,260 M 0,350 L 1200,350"
        stroke="#383d44" stroke-width="1" opacity="0.5" />
      <path class="grid-lines-vertical"
        d="M 200,0 L 0,400 M 400,0 L 250,400 M 550,0 L 500,400 M 600,0 L 600,400 M 650,0 L 700,400 M 800,0 L 950,400 M 1000,0 L 1200,400"
        stroke="#383d44" stroke-width="1" opacity="0.5" />
    </g>

    <g class="reticle-node">
      <circle cx="600" cy="150" r="5" fill="#2c70cf" class="pulse-dot" />
      <circle cx="600" cy="150" r="20" stroke="#2c70cf" stroke-width="1.5" fill="none" class="pulse-ring" />
      <line x1="550" y1="150" x2="650" y2="150" stroke="#2c70cf" stroke-width="0.5" opacity="0.4" />
      <line x1="600" y1="100" x2="600" y2="200" stroke="#2c70cf" stroke-width="0.5" opacity="0.4" />
    </g>
  </svg>
  <div class="engine-status-text">{{statusText}}</div>
</div>
