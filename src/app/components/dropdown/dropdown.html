<div class="dropdown-container">
  <div>
    <button type="button" (click)="toggleDropdown()" class="dropdown-button" id="menu-button" aria-expanded="true"
      aria-haspopup="true">
      {{ selectedItem ? selectedItem.key : 'Select an item' }}
      <svg class="dropdown-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
        aria-hidden="true">
        <path fill-rule="evenodd"
          d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"
          clip-rule="evenodd" />
      </svg>
    </button>
  </div>
  @if (isOpen) {

  <div class="dropdown-menu" role="menu" aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1">
    <div class="dropdown-items-wrapper" role="none">
      @for (item of items; track $index) {
      <a (click)="selectItem(item)" class="dropdown-item" role="menuitem" tabindex="-1">
        {{ item.key}}
      </a>
      }
    </div>
  </div>
  }

</div>
