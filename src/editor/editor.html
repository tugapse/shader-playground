<editor-top-bar [scene]="scene" [isEditorPaused]="isPaused"></editor-top-bar>

<div class="container">
  <editor-sidebar [scene]="scene"></editor-sidebar>
  <div class="canvas-info">
    <span>{{fpsCounter}}</span>
  </div>
  @if(canvasVisible){ <editor-canvas tabindex="0" class="canvas" [scene]="scene"
    (fps)="onFpsUpdated($event)"
    (onGlContextCreated)="onGlContextCreated($event)"></editor-canvas>}
</div>

<editor-inpector [targetEntity]="inspectorSelectedEntity"></editor-inpector>
