<editor-top-bar [scene]="scene" [isEditorPaused]="isPaused"></editor-top-bar>

<div class="container">
  <aside class="sidebar">
    <app-scene-tree [targetScene]="scene"></app-scene-tree>
  </aside>

  @switch (editorState.centralView()) {
    @case ("canvas") {
      <editor-canvas
        tabindex="0"
        class="canvas"
        [ngClass]="{ fullscreen: isFullScreen }"
        [scene]="scene"
        (stats)="onFpsUpdated($event)"
        (onGlContextCreated)="onGlContextCreated($event)"
      ></editor-canvas>
      <editor-engine-stats [stats]="stats"></editor-engine-stats>
    }
    <!-- @case ("assets") {
      <app-assets-explorer></app-assets-explorer>
    }
    @case ("code-editor") {
      <editor-code-editor></editor-code-editor>
    } -->
  }
</div>

<editor-inpector [targetEntity]="inspectorSelectedEntity"></editor-inpector>

@if (toastMessage) {
  <div class="toast-notification">
    {{ toastMessage }}
  </div>
}

<div class="desktop-area">
  @for (win of windowService.windows$ | async; track win.id) {
    <editor-window
      [windowId]="win.id"
      [windowtitle]="win.title"
      [windowIconName]="win.iconName"
      [childComponentType]="win.component"
      [childInputs]="win.inputs"
      [isActive]="win.id === (windowService.activeWindowId$ | async)"
      [style.z-index]="win.zIndex"
    >
    </editor-window>
  }
</div>
