<editor-inpector-toggle-panel
  title="Transform"
  [collapsed]="collapsed"
  [isChild]="true"
>
  @if (transform) {
    <section>
      <span class="title">Position</span>
      <div class="line-item">
        <span
          appDragHandle
          [dragCursor]="'move'"
          (drag)="onSpanDrag(0, 0, $event)"
          >X</span
        >
        <input
          class="text-input"
          [value]="transform.localPosition[0]"
          (change)="onPositionChanged(0, $event)"
        />
        <span
          appDragHandle
          [dragCursor]="'move'"
          (drag)="onSpanDrag(1, 0, $event)"
          >Y</span
        >
        <input
          class="text-input"
          [value]="transform.localPosition[1]"
          (change)="onPositionChanged(1, $event)"
        />
        <span
          appDragHandle
          [dragCursor]="'move'"
          (drag)="onSpanDrag(2, 0, $event)"
          >Z</span
        >
        <input
          class="text-input"
          [value]="transform.localPosition[2]"
          (change)="onPositionChanged(2, $event)"
        />
      </div>

      <span class="title">Rotation</span>
      <div class="line-item">
        <span
          appDragHandle
          [dragCursor]="'move'"
          (drag)="onSpanDrag(0, 1, $event)"
          >X</span
        >
        <input
          class="text-input"
          [value]="transform.localRotation[0]"
          (change)="onRotationChanged(0, $event)"
        />
        <span
          appDragHandle
          [dragCursor]="'move'"
          (drag)="onSpanDrag(1, 1, $event)"
          >Y</span
        >
        <input
          class="text-input"
          [value]="transform.localRotation[1]"
          (change)="onRotationChanged(1, $event)"
        />
        <span
          appDragHandle
          [dragCursor]="'move'"
          (drag)="onSpanDrag(2, 1, $event)"
          >Z</span
        >
        <input
          class="text-input"
          [value]="transform.localRotation[2]"
          (change)="onRotationChanged(2, $event)"
        />
      </div>

      <span class="title">Scale</span>
      <div class="line-item">
        <span
          appDragHandle
          [dragCursor]="'move'"
          (drag)="onSpanDrag(0, 2, $event)"
          >X</span
        ><input
          class="text-input"
          [value]="scaleX"
          (change)="onScaleChanged(0, $event)"
        />
        <span
          appDragHandle
          [dragCursor]="'move'"
          (drag)="onSpanDrag(1, 2, $event)"
          >Y</span
        ><input
          class="text-input"
          [value]="scaleY"
          (change)="onScaleChanged(1, $event)"
        />
        <span
          appDragHandle
          [dragCursor]="'move'"
          (drag)="onSpanDrag(2, 2, $event)"
          >Z</span
        ><input
          class="text-input"
          [value]="scaleZ"
          (change)="onScaleChanged(2, $event)"
        />
      </div>
    </section>
  }
</editor-inpector-toggle-panel>
