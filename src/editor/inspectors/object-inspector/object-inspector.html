<editor-inpector-toggle-panel [title]="label">

@for (item of _properties; track $index) {
@switch (item.type) {
@case ("string") { <editor-text-input-inspector [label]="item.key.capitalize()" [value]="item.value"
  (change)="onValueChanged(item,$event)"></editor-text-input-inspector> }

@case ("number") { <editor-text-input-inspector [isNumber]="true" [label]="item.key.capitalize()" [value]="item.value"
  (change)="onValueChanged(item,$event)" [dragScale]="0.001"></editor-text-input-inspector> }

@case ("boolean") { <app-boolean-inspector [label]="item.key.capitalize()" [title]="item.key" [active]="item.property"
  (change)="item.property = $event"></app-boolean-inspector>}

@case ("color") {<editor-color-inspector [title]="item.key" [selectedColor]="item.value"
  (colorChange)="onColorChanged(item,$event)"></editor-color-inspector> }

@case ("vector234") { <editor-vector-inspector   [vectorKeys]="['x','y','z','w']" [vector]="item.value"
  (vectorChanged)="onVectorChanged(item, $event)"></editor-vector-inspector>}
<!-- @default { <editor-object-inspector [title]="item.key.capitalize()" [targetObject]="item"></editor-object-inspector>  } -->
}
}

</editor-inpector-toggle-panel>
