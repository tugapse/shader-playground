<editor-inpector-toggle-panel
  [title]="label.capitalize()"
  [collapsed]="true"
  [isChild]="true"
>
  <span
    header-content
    class="panel-header"
    [style.background-color]="
      'rgba(' +
      selectedColor.r * 255 +
      ',' +
      selectedColor.g * 255 +
      ',' +
      selectedColor.b * 255 +
      ',' +
      selectedColor.a +
      ')'
    "
    [style.color]="textColor"
  >
    {{ r }} · {{ g }} · {{ b }} · {{ a }}
  </span>
  <app-color-picker
    class="color-picker"
    (colorChange)="onColorChanged($event)"
    [color]="selectedColor"
  ></app-color-picker>
</editor-inpector-toggle-panel>
