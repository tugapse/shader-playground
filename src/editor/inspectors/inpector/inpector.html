@if (entity) {
<div class="inspector">

  <div class="header">
    <app-icon class="view-icon" [iconName]="entity.active ? 'fas fa-toggle-on' : 'fas fa-toggle-off'"
      (click)="entity.active = !entity.active"></app-icon>
    <span>Inspector</span>
    <div class="buttons">
      <app-icon class="icon" iconName="fa-close" (click)="entity=null"></app-icon>
      <app-icon class="view-icon" [iconName]="entity.active ? 'fas fa-toggle-on' : 'fas fa-toggle-off'"
        (click)="entity.active = !entity.active"></app-icon>
      <app-icon tooltip="Close inspector" class="icon" iconName="fa-close" (click)="onClose()"></app-icon>
    </div>
  </div>
  <section>
    <span>Name</span><input class="text-input" [(value)]="entity!.name" (change)="onNameChanged($event)">
  </section>
  <section>
    <span>Tag</span><input class="text-input" [(value)]="entity!.tag" (change)="onTagChanged($event)">
  </section>
  <editor-transform-inspector [targetEntity]="entity"></editor-transform-inspector>
</div>
}
