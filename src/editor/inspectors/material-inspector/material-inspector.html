@if (_selectedObject) {
  <editor-inpector-toggle-panel
    [title]="_selectedObject.property.name || 'Material'"
    [collapsed]="true"
  >
    @for (item of _properties; track $index) {
      @switch (item.type) {
        @case ("object") {
          <editor-object-inspector
            [isChild]="true"
            [targetObject]="{
              key: item.key,
              type: item.type,
              property: item.value,
            }"
          ></editor-object-inspector>
        }
        @default {
          <editor-default-inspector [item]="item"></editor-default-inspector>
        }
      }
    }
  </editor-inpector-toggle-panel>
}
