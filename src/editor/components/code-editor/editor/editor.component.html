

<div class="code-editor-container">
  @if (activeAsset()) {
    <!-- Barra de Ferramentas do Editor -->
    <div class="editor-header">
      <div class="file-info">
        <span class="file-icon">JS</span>
        <span class="file-name">{{ activeAsset()?.name }}</span>
        @if (isDirty()) { <span class="dirty-indicator">●</span> }
      </div>
      <div class="editor-actions">
        <button (click)="saveContent()" [disabled]="!isDirty()" class="save-btn">
          Guardar (Ctrl+S)
        </button>
      </div>
    </div>

    <!-- Área do Editor (Placeholder para Monaco/CodeMirror) -->
    <div class="editor-viewport" #editorHost>
      @if (isLoading()) {
        <div class="loading-overlay">
          <div class="spinner"></div>
          <span>A carregar script...</span>
        </div>
      }
    </div>

    <!-- Barra de Status -->
    <div class="editor-footer">
      <span>JavaScript</span>
      <span>UTF-8</span>
    </div>
  } @else {
    <div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.2">
        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <p>Seleciona um script no explorador para editar</p>
    </div>
  }
</div>
