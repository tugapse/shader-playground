<div class="header">
  <span class="title">{{title}}</span>
  <ng-content select="[header-content]"></ng-content>
  <app-icon class="chevron" [iconName]="collapsed ? 'fa-chevron-left' :'fa-chevron-down'"
    (click)="collapsed=!collapsed"></app-icon>
</div>
<div class="container" [ngClass]="{collapsed:collapsed,child:isChild}">
  <ng-content></ng-content>
</div>
