<h4 class="tree-header">Scene Tree</h4>
<section>

  @for (obj of targetScene?.objects; track $index) {

  <div class="item-container" (click)="entitySelected(obj,$event)">
    <app-icon [iconName]="iconNames[obj.entityType]"></app-icon>
    <span class="item-value" [id]="obj.uuid">
      {{obj.name}}
    </span>
    <app-icon class="view-icon" [iconName]="obj.show ? 'fa-eye' : 'fa-eye-slash'"
      (click)="toggleObj(obj,$event)"></app-icon>
  </div>
  }@empty {
  <div>No Objects added to the scene</div>
  }
</section>
